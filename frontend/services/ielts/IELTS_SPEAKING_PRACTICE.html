<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Practice Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f0f4f9; --bg-secondary: #ffffff; --bg-card: #ffffff; --bg-card-alt: #f8faff;
            --bg-input: #f0f4fe; --bg-hover: #eef2f7; --bg-status: #e8f5ed; --bg-progress: #d9e2ef;
            --bg-nav: #f8faff; --bg-tips: #f0f7fe; --bg-answer: #f6faff; --bg-toggle: #eef2f7;
            --bg-part-tab: #eef2f7; --bg-part-tab-active: #ffffff; --bg-hero: linear-gradient(135deg, #e8f0fe 0%, #d4e4ff 100%);
            --text-primary: #0b1e33; --text-secondary: #1f3a5f; --text-muted: #5a7a9a; --text-light: #ffffff; --text-link: #2a7de1;
            --border-light: #e6edf8; --border-hover: #b6cef0; --border-part: #d0ddee;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06); --shadow-md: 0 8px 30px rgba(0,0,0,0.08); --shadow-lg: 0 20px 60px rgba(0,0,0,0.12); --shadow-xl: 0 30px 80px rgba(0,0,0,0.15);
            --gradient-primary: linear-gradient(135deg, #2a7de1, #6ca6ff); --gradient-success: linear-gradient(135deg, #1d9c73, #34d399);
            --gradient-danger: linear-gradient(135deg, #d1453b, #f87171); --gradient-warning: linear-gradient(135deg, #f0b429, #fbbf24);
            --gradient-hero: linear-gradient(135deg, #1a5fb4 0%, #2a7de1 50%, #6ca6ff 100%);
            --gradient-part1: linear-gradient(135deg, #1d9c73, #34d399); --gradient-part2: linear-gradient(135deg, #f0b429, #fbbf24);
            --gradient-part3: linear-gradient(135deg, #2a7de1, #6ca6ff); --radius-sm: 12px; --radius-md: 20px; --radius-lg: 28px; --radius-xl: 40px; --radius-full: 9999px;
        }
        [data-theme="dark"] {
            --bg-primary: #0f1420; --bg-secondary: #1a1f2e; --bg-card: #1e2436; --bg-card-alt: #252b3f;
            --bg-input: #252b3f; --bg-hover: #2d3448; --bg-status: #1a2e2a; --bg-progress: #2d3448;
            --bg-nav: #1a1f2e; --bg-tips: #1a2e3a; --bg-answer: #1a2a3a; --bg-toggle: #2d3448;
            --bg-part-tab: #252b3f; --bg-part-tab-active: #1e2436; --bg-hero: linear-gradient(135deg, #0f1420 0%, #1a1f2e 100%);
            --text-primary: #e8edf5; --text-secondary: #b0c4de; --text-muted: #7a8aa8; --text-light: #ffffff;
            --border-light: #2d3448; --border-hover: #4a5578; --border-part: #2d3448;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 20px; transition: background 0.4s, color 0.4s; }
        .hero { max-width: 1100px; margin: 0 auto; padding: 40px; background: var(--bg-hero); border-radius: var(--radius-xl); text-align: center; margin-bottom: 20px; }
        .hero h1 { font-size: 2.5rem; font-weight: 900; color: #fff; }
        .hero p { color: rgba(255, 255, 255, 0.9); margin-top: 8px; }
        .container { max-width: 1100px; margin: 0 auto; background: var(--bg-secondary); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow-lg); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-toggle { background: var(--bg-toggle); border: none; padding: 8px 16px; border-radius: 50px; cursor: pointer; font-family: inherit; color: var(--text-primary); }

        /* Navigation */
        .part-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .part-tab { flex: 1; padding: 14px; border: none; border-radius: var(--radius-md); background: var(--bg-part-tab); color: var(--text-muted); font-weight: 700; cursor: pointer; }
        .part-tab.active { background: #2a7de1; color: #fff; box-shadow: 0 4px 16px rgba(42,125,225,0.3); }

        /* Cards */
        .question-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 24px; margin-bottom: 20px; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
        .question-text .highlight { color: #2a7de1; background: rgba(42,125,225,0.1); padding: 0 4px; border-radius: 4px; }

        /* Recording Controls */
        .recording-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .record-btn { padding: 10px 18px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .record-btn.start { background: #ef4444; color: #fff; }
        .record-btn.stop { background: #6b7280; color: #fff; }
        .record-btn.playback { background: #10b981; color: #fff; }
        .record-btn.download { background: #f59e0b; color: #fff; }
        .record-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .record-btn.start.recording { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); } }

        .recording-status { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .recording-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
        .recording-status .dot.active { background: #ef4444; animation: pulse-dot 1s infinite; }
        .recording-status .dot.saved { background: #10b981; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Result & Feedback */
        .feedback-card { background: var(--bg-card); border: 2px solid #10b981; border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; display: none; }
        .feedback-card.visible { display: block; }
        .feedback-card .fb-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .feedback-card .fb-title { font-weight: 700; color: #10b981; }
        .feedback-card .fb-stars { font-size: 1.2rem; color: #f59e0b; }
        .feedback-card .fb-message { font-weight: 600; margin: 10px 0; }
        .feedback-card .fb-tip { background: rgba(42,125,225,0.1); padding: 10px; border-radius: 10px; margin: 10px 0; font-size: 0.9rem; }
        .feedback-card .fb-actions { display: flex; gap: 10px; }
        .feedback-card .fb-actions button { padding: 8px 16px; border-radius: 50px; border: none; cursor: pointer; font-family: inherit; font-weight: 600; }

        /* Timer */
        .timer-section { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .timer-display { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--bg-input); padding: 10px 30px; border-radius: 50px; }
        .timer-controls button { padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-family: inherit; font-weight: 600; }
        #startTimerBtn { background: #2a7de1; color: #fff; }
        #resetTimerBtn { background: var(--bg-toggle); color: var(--text-secondary); }

        /* Real Talk */
        .real-talk { margin-top: 30px; }
        .real-talk-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; }
        .real-talk-phrase { background: var(--bg-card); border: 1px solid var(--border-light); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .real-talk-phrase .phrase { font-size: 1.1rem; font-weight: 600; }
        .real-talk-phrase .phrase-mean { font-size: 0.8rem; color: var(--text-muted); }
        .real-talk-phrase .listen-btn { background: #2a7de1; color: #fff; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; }

        /* Floating Record */
        .floating-record { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .fab-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #ef4444; color: #fff; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.5); }
        .fab-btn.recording { animation: pulse 1.2s infinite; }
        .fab-btn.idle { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-light); }

        /* Home Button */
        .home-btn { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; font-size: 11px; font-weight: bold; background: #2a7de1; padding: 8px 12px; border-radius: 8px; }
    </style>
</head>
<body>
    <a href="/" class="home-btn">🏠 Home</a>

    <!-- FLOATING RECORD -->
    <div class="floating-record" id="floatingRecord">
        <button class="fab-btn idle" id="fabBtn"><i class="fas fa-microphone"></i></button>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>🎤 IELTS Speaking Practice Pro</h1>
        <p>Master Part 1, 2, and 3 with video recording.</p>
    </div>

    <!-- CONTAINER -->
    <div class="container">
        <div class="header">
            <div class="header-badge">Practice Mode</div>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>

        <div class="part-nav" id="partNav">
            <button class="part-tab active" data-part="1">Part 1</button>
            <button class="part-tab" data-part="2">Part 2</button>
            <button class="part-tab" data-part="3">Part 3</button>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText">Loading question...</div>
            
            <div class="recording-controls">
                <button class="record-btn start" id="recordBtn" disabled><i class="fas fa-microphone"></i> Record</button>
                <button class="record-btn stop" id="stopRecordBtn" disabled><i class="fas fa-stop"></i> Stop</button>
                <button class="record-btn playback" id="playbackBtn" disabled><i class="fas fa-play"></i> Playback</button>
                <button class="record-btn download" id="downloadBtn" disabled><i class="fas fa-download"></i> Download</button>
                <span class="recording-status"><span class="dot" id="recordingDot"></span> <span id="recordingStatusText">Ready</span></span>
            </div>
            
            <div class="feedback-card" id="feedbackCard">
                <div class="fb-header"><span class="fb-title">✅ Recording Saved!</span><span class="fb-stars">★★★★★</span></div>
                <div class="fb-message" id="feedbackMsg">Great job! Keep practicing!</div>
                <div class="fb-tip">💡 Tip: Remember to speak clearly and at a steady pace.</div>
                <div class="fb-actions"><button class="fb-listen" onclick="playFeedback()"><i class="fas fa-play"></i> Listen</button><button class="fb-download" onclick="downloadFeedback()"><i class="fas fa-download"></i> Download</button></div>
            </div>
        </div>

        <div class="timer-section">
            <div class="timer-display" id="timerDisplay">02:00</div>
            <div class="timer-controls">
                <button id="startTimerBtn"><i class="fas fa-play"></i> Start</button>
                <button id="resetTimerBtn"><i class="fas fa-redo-alt"></i> Reset</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const parts = {
                1: [
                    'Let\'s talk about <span class="highlight">your home</span>.<br>Where do you live and who do you live with?',
                    'Let\'s talk about <span class="highlight">your work or studies</span>.<br>What do you do?',
                    'Let\'s talk about <span class="highlight">free time</span>.<br>What do you enjoy doing in your free time?'
                ],
                2: [
                    'Describe <span class="highlight">a memorable trip</span> you have taken.',
                    'Describe <span class="highlight">a person who inspires you</span>.',
                    'Describe <span class="highlight">a skill you would like to learn</span>.'
                ],
                3: [
                    'Let\'s discuss <span class="highlight">globalization</span>.<br>What are the benefits and challenges?',
                    'Let\'s discuss <span class="highlight">education systems</span>.<br>How should education evolve?',
                    'Let\'s discuss <span class="highlight">climate change</span>.<br>What can individuals do?'
                ]
            };
            const totalQuestions = 20;
            let currentPart = 1;
            let currentIndex = 0;
            let questionRecordings = {};
            let recordingBlob = null;
            let recordingUrl = null;
            let mediaRecorder = null;
            let stream = null;
            let isRecording = false;
            let hasPermission = false;
            let timerInterval = null;
            let timeSeconds = 120;
            let isTimerRunning = false;

            const questionText = document.getElementById('questionText');
            const recordBtn = document.getElementById('recordBtn');
            const stopRecordBtn = document.getElementById('stopRecordBtn');
            const playbackBtn = document.getElementById('playbackBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const recordingDot = document.getElementById('recordingDot');
            const recordingStatusText = document.getElementById('recordingStatusText');
            const feedbackCard = document.getElementById('feedbackCard');
            const timerDisplay = document.getElementById('timerDisplay');
            const startTimerBtn = document.getElementById('startTimerBtn');
            const resetTimerBtn = document.getElementById('resetTimerBtn');
            const themeToggle = document.getElementById('themeToggle');
            const fabBtn = document.getElementById('fabBtn');

            // Theme
            function setTheme(t) {
                document.documentElement.setAttribute('data-theme', t);
                themeToggle.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                localStorage.setItem('speaking_theme', t);
            }
            themeToggle.addEventListener('click', function() {
                setTheme(localStorage.getItem('speaking_theme') === 'dark' ? 'light' : 'dark');
            });
            setTheme(localStorage.getItem('speaking_theme') || 'light');

            // Part Selection
            const partTabs = document.querySelectorAll('.part-tab');
            partTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    partTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentPart = parseInt(this.dataset.part);
                    currentIndex = 0;
                    // Set timer based on part
                    if (currentPart === 2) {
                        timeSeconds = 180; // 3 minutes
                    } else {
                        timeSeconds = 120; // 2 minutes
                    }
                    updateTimerDisplay();
                    renderQuestion();
                });
            });

            // Render
            function renderQuestion() {
                const questions = parts[currentPart];
                questionText.innerHTML = questions[currentIndex];
                updateTimerDisplay();
                resetRecording();
            }

            // Recording Logic
            async function getPermission() {
                if (hasPermission) return true;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                    hasPermission = true;
                    recordBtn.disabled = false;
                    return true;
                } catch (e) {
                    alert('Microphone or Camera access needed.');
                    return false;
                }
            }

            recordBtn.addEventListener('click', async function() {
                if (!await getPermission()) return;
                if (isRecording) return;

                recordingBlob = null;
                state.chunks = [];
                mediaRecorder = new MediaRecorder(stream);
                isRecording = true;

                this.disabled = true;
                this.classList.add('recording');
                stopRecordBtn.disabled = false;
                recordingDot.classList.add('active');
                recordingStatusText.textContent = 'Recording...';

                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) state.chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    recordingBlob = new Blob(state.chunks, { type: 'video/webm' });
                    recordingUrl = URL.createObjectURL(recordingBlob);
                    isRecording = false;
                    this.disabled = false;
                    this.classList.remove('recording');
                    stopRecordBtn.disabled = true;
                    recordingDot.classList.remove('active');
                    recordingDot.classList.add('saved');
                    recordingStatusText.textContent = 'Saved!';
                    playbackBtn.disabled = false;
                    downloadBtn.disabled = false;
                    feedbackCard.classList.add('visible');
                };

                mediaRecorder.start();
            });

            stopRecordBtn.addEventListener('click', function() {
                if (mediaRecorder && isRecording) mediaRecorder.stop();
            });

            playbackBtn.addEventListener('click', function() {
                if (recordingUrl) {
                    const video = document.createElement('video');
                    video.src = recordingUrl;
                    video.controls = true;
                    video.style.width = '100%';
                    video.style.marginTop = '10px';
                    document.querySelector('.question-card').appendChild(video);
                }
            });

            downloadBtn.addEventListener('click', function() {
                if (recordingUrl) {
                    const a = document.createElement('a');
                    a.href = recordingUrl;
                    a.download = 'IELTS_Part' + currentPart + '_Q' + (currentIndex + 1) + '.webm';
                    a.click();
                }
            });

            // Timer
            function updateTimerDisplay() {
                const m = Math.floor(timeSeconds / 60);
                const s = timeSeconds % 60;
                timerDisplay.textContent = m + ':' + ('0' + s).slice(-2);
            }

            function startTimer() {
                if (isTimerRunning) return;
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timeSeconds--;
                    updateTimerDisplay();
                    if (timeSeconds <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        alert('Time is up!');
                    }
                }, 1000);
            }

            function resetTimer() {
                clearInterval(timerInterval);
                isTimerRunning = false;
                if (currentPart === 2) {
                    timeSeconds = 180;
                } else {
                    timeSeconds = 120;
                }
                updateTimerDisplay();
            }

            startTimerBtn.addEventListener('click', startTimer);
            resetTimerBtn.addEventListener('click', resetTimer);

            // Floating Record Button
            fabBtn.addEventListener('click', async function() {
                if (!await getPermission()) return;
                if (isRecording) {
                    if (mediaRecorder) mediaRecorder.stop();
                } else {
                    recordBtn.click();
                }
            });

            function resetRecording() {
                recordingBlob = null;
                recordingUrl = null;
                playbackBtn.disabled = true;
                downloadBtn.disabled = true;
                stopRecordBtn.disabled = true;
                recordBtn.disabled = !hasPermission;
                recordingDot.classList.remove('active', 'saved');
                recordingStatusText.textContent = 'Ready';
                feedbackCard.classList.remove('visible');
            }

            // Initialize
            getPermission();
            renderQuestion();
        })();
    </script>
</body>
</html>
