<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Global EdTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6C3CE1; --primary-light: #8B5CF6; --secondary: #F59E0B;
      --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
      --bg: #0F0A1A; --card: #1A142F; --border: #2D2448;
      --text: #FFFFFF; --text-2: #B8B0D0; --text-3: #7A7199;
      --radius: 12px;
    }
    [data-theme="light"] {
      --bg: #F5F0FF; --card: #FFFFFF; --border: #E0D6F0;
      --text: #1A142F; --text-2: #4A3A6B; --text-3: #7A7199;
    }
    [data-theme="light"] .user-row.header { background: rgba(108,60,225,0.08); }
    [data-theme="light"] .icon-btn { background: #F5F0FF; }
    [data-theme="light"] body { background: var(--bg); }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    
    /* Header */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .top-bar h1 { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, var(--text), var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .top-bar .actions { display: flex; gap: 10px; }
    .btn { padding: 10px 18px; border: none; border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-ghost { background: var(--card); color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-3); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }
    .stat-value { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--primary-light), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Search Bar */
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 250px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text); font-family: inherit; font-size: 0.9rem; }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { outline: none; border-color: var(--primary); }
    .filter-select { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
    
    /* User Table */
    .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .user-row { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr 1.5fr 2fr; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); align-items: center; font-size: 0.85rem; }
    .user-row:last-child { border-bottom: none; }
    .user-row.header { background: rgba(108,60,225,0.15); font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2); }
    .user-row:not(.header):hover { background: rgba(108,60,225,0.05); }
    .user-email { font-weight: 600; color: var(--text); word-break: break-all; }
    .user-meta { color: var(--text-3); font-size: 0.75rem; margin-top: 3px; }
    .badge { padding: 4px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
    .badge.active { background: rgba(16,185,129,0.15); color: var(--success); }
    .badge.expired { background: rgba(245,158,11,0.15); color: var(--warning); }
    .badge.disabled { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge.password_expired { background: rgba(108,60,225,0.15); color: var(--primary-light); }
    .badge.admin { background: rgba(245,158,11,0.2); color: var(--warning); }
    
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .icon-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all 0.2s; }
    .icon-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .icon-btn.danger:hover { background: var(--danger); border-color: var(--danger); }
    .icon-btn.success:hover { background: var(--success); border-color: var(--success); }
    
    /* Date cell */
    .date-cell { font-size: 0.75rem; color: var(--text-2); }
    .date-cell.urgent { color: var(--warning); font-weight: 700; }
    .date-cell.expired { color: var(--danger); font-weight: 700; }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .modal-overlay.visible { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 500px; width: 100%; }
    .modal-box h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .modal-box p { color: var(--text-2); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
    .modal-box .actions { display: flex; gap: 10px; justify-content: flex-end; }
    
    /* Toast */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--primary); color: #fff; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 40px rgba(108,60,225,0.5); z-index: 10000; opacity: 0; transition: all 0.3s; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    
    /* Extend menu */
    .extend-menu { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .extend-menu button { display: block; width: 100%; padding: 8px 16px; background: transparent; color: var(--text); border: none; border-radius: 6px; font-family: inherit; font-size: 0.8rem; cursor: pointer; text-align: left; }
    .extend-menu button:hover { background: var(--primary); }
    
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .user-row { grid-template-columns: 1fr; gap: 8px; padding: 16px; }
      .user-row.header { display: none; }
      .user-row > div:before { content: attr(data-label); display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
    }
   @keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
   }
  </style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <h1>🛡️ Admin Dashboard</h1>
        <div class="actions">
      <button class="btn btn-ghost" id="themeToggle" title="Toggle Light/Dark Mode" onclick="toggleTheme()">
        <i class="fas fa-sun" id="themeIcon"></i>
      </button>
      <a href="/" class="btn btn-ghost"><i class="fas fa-home"></i> Home</a>
      <button class="btn btn-primary" id="refreshBtn" onclick="refreshData()">
  <i class="fas fa-sync" id="refreshIcon"></i> Refresh
</button>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" id="stat-active">—</div></div>
    <div class="stat-card"><div class="stat-label">Expired</div><div class="stat-value" id="stat-expired">—</div></div>
    <div class="stat-card"><div class="stat-label">Disabled</div><div class="stat-value" id="stat-disabled">—</div></div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchBox" placeholder="🔍 Search by email..." />
    <select class="filter-select" id="filterBox">
      <option value="all">All Users</option>
      <option value="active">Active Only</option>
      <option value="expired">Expired</option>
      <option value="disabled">Disabled</option>
    </select>
  </div>

  <div class="table-wrapper">
    <div class="user-row header">
      <div>Email</div>
      <div>Status</div>
      <div>Tier</div>
      <div>Last Login</div>
      <div>Access Expires</div>
      <div>Actions</div>
    </div>
    <div id="usersList"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Confirm</h3>
    <p id="modalMessage">Are you sure?</p>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let allUsers = [];

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diffDays = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  return { str: dateStr, days: diffDays, iso };
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadStats() {
  try {
    const r = await fetch('/api/admin/stats');
    const d = await r.json();
    document.getElementById('stat-total').textContent = d.total;
    document.getElementById('stat-active').textContent = d.active;
    document.getElementById('stat-expired').textContent = d.expired;
    document.getElementById('stat-disabled').textContent = d.disabled;
  } catch(e) { console.error('Stats error:', e); }
}

async function loadUsers() {
  try {
    const r = await fetch('/api/admin/users');
    if (!r.ok) throw new Error('Failed to load users');
    allUsers = await r.json();
    renderUsers();
  } catch(e) {
    showToast('Failed to load users', 'error');
  }
}

function renderUsers() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const filter = document.getElementById('filterBox').value;
  
  let filtered = allUsers;
  if (search) filtered = filtered.filter(u => u.email.toLowerCase().includes(search));
  if (filter !== 'all') filtered = filtered.filter(u => u.status === filter);
  
  const container = document.getElementById('usersList');
  if (!filtered.length) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-3);">No users found</div>';
    return;
  }
  
  container.innerHTML = filtered.map(u => {
    const access = formatDate(u.access_expires_at);
    const lastLogin = u.last_login ? new Date(u.last_login).toLocaleDateString('en-GB') : 'Never';
    const accessClass = access.days < 0 ? 'expired' : (access.days < 7 ? 'urgent' : '');
    const statusBadge = u.is_admin ? '<span class="badge admin">Admin</span>' : `<span class="badge ${u.status}">${u.status.replace('_',' ')}</span>`;
    
    return `
      <div class="user-row">
        <div data-label="Email">
          <div class="user-email">${escapeHtml(u.email)}</div>
          <div class="user-meta">${u.is_admin ? '👑 Administrator' : 'Client'}</div>
        </div>
        <div data-label="Status">${statusBadge}</div>
        <div data-label="Tier"><span style="color:var(--text-2);text-transform:capitalize;">${u.subscription_tier || 'free'}</span></div>
        <div data-label="Last Login" class="date-cell">${lastLogin}</div>
        <div data-label="Access Expires" class="date-cell ${accessClass}">
          ${access.str}
          ${access.days !== undefined ? `<div style="font-size:0.7rem;opacity:0.8;">${access.days < 0 ? Math.abs(access.days) + ' days ago' : access.days + ' days left'}</div>` : ''}
        </div>
        <div data-label="Actions" class="row-actions">
          <button class="icon-btn success" title="Extend Access" onclick="showExtendMenu(event, '${u.id}')"><i class="fas fa-clock"></i></button>
          <button class="icon-btn" title="Reset Password" onclick="resetPassword('${u.id}', '${escapeHtml(u.email)}')"><i class="fas fa-key"></i></button>
          <button class="icon-btn" title="${u.is_active ? 'Disable' : 'Enable'}" onclick="toggleUser('${u.id}', '${escapeHtml(u.email)}', ${u.is_active})">
            <i class="fas fa-${u.is_active ? 'ban' : 'check'}"></i>
          </button>
          ${u.is_admin ? '' : `<button class="icon-btn danger" title="Delete User" onclick="deleteUser('${u.id}', '${escapeHtml(u.email)}')"><i class="fas fa-trash"></i></button>`}
        </div>
      </div>
    `;
  }).join('');
}

// Extend menu
function showExtendMenu(event, userId) {
  event.stopPropagation();
  document.querySelectorAll('.extend-menu').forEach(m => m.remove());
  
  const menu = document.createElement('div');
  menu.className = 'extend-menu';
  menu.style.top = (event.pageY + 8) + 'px';
  menu.style.left = (event.pageX - 60) + 'px';
  menu.innerHTML = `
    <button onclick="extendUser('${userId}', 7)">+ 7 days</button>
    <button onclick="extendUser('${userId}', 30)">+ 30 days</button>
    <button onclick="extendUser('${userId}', 90)">+ 90 days</button>
    <button onclick="extendUser('${userId}', 365)">+ 365 days</button>
  `;
  document.body.appendChild(menu);
  
  setTimeout(() => {
    document.addEventListener('click', function closeMenu() {
      menu.remove();
      document.removeEventListener('click', closeMenu);
    }, { once: true });
  }, 10);
}

async function extendUser(userId, days) {
  try {
    const r = await fetch(`/api/admin/users/${userId}/extend`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ days })
    });
    const d = await r.json();
    if (d.success) {
      showToast(`✅ Extended by ${days} days`);
// ============================================================
// THEME TOGGLE (Light / Dark Mode)
// ============================================================

      loadAll();
    } else {
      showToast(d.error || 'Failed', 'error');
    }
  } catch(e) { showToast('Network error', 'error'); }
}

async function toggleUser(userId, email, isActive) {
  const action = isActive ? 'disable' : 'enable';
  openModal(`Confirm ${action}`, `Are you sure you want to ${action} ${email}?`, async () => {
    try {
      const r = await fetch(`/api/admin/users/${userId}/toggle`, { method: 'POST' });
      const d = await r.json();
      if (d.success) {
        showToast(`✅ User ${d.is_active ? 'enabled' : 'disabled'}`);
        loadAll();
      } else {
        showToast(d.error || 'Failed', 'error');
      }
    } catch(e) { showToast('Network error', 'error'); }
  });
}

async function resetPassword(userId, email) {
  openModal('Reset Password', `Generate a new password for ${email}? It will be sent by email.`, async () => {
    try {
      const r = await fetch(`/api/admin/users/${userId}/reset-password`, { method: 'POST' });
      const d = await r.json();
      if (d.success) {
        if (d.email_sent) showToast('✅ New password sent by email');
        else showToast(`⚠️ Email failed. New password: ${d.new_password}`, 'error');
      } else {
        showToast(d.error || 'Failed', 'error');
      }
    } catch(e) { showToast('Network error', 'error'); }
  });
}

async function deleteUser(userId, email) {
  openModal('Delete User', `⚠️ Permanently delete ${email}? This cannot be undone.`, async () => {
    try {
      const r = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
      const d = await r.json();
      if (d.success) {
        showToast('✅ User deleted');
        loadAll();
      } else {
        showToast(d.error || 'Failed', 'error');
      }
    } catch(e) { showToast('Network error', 'error'); }
  });
}

// Modal
let modalCallback = null;
function openModal(title, msg, cb) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMessage').textContent = msg;
  document.getElementById('modalOverlay').classList.add('visible');
  modalCallback = cb;
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
  modalCallback = null;
}
document.getElementById('modalConfirm').addEventListener('click', () => {
  if (modalCallback) modalCallback();
  closeModal();
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// Filters
document.getElementById('searchBox').addEventListener('input', renderUsers);
document.getElementById('filterBox').addEventListener('change', renderUsers);

async function loadAll() {
  await Promise.all([loadStats(), loadUsers()]);
}

loadAll();
async function refreshData() {
  var icon = document.getElementById('refreshIcon');
  var btn = document.getElementById('refreshBtn');
  if (icon) icon.style.animation = 'spin 0.6s linear infinite';
  if (btn) btn.disabled = true;
  try {
    await loadAll();
    showToast('✅ Data refreshed', 'success');
  } catch (e) {
    showToast('❌ Refresh failed', 'error');
  } finally {
    if (icon) icon.style.animation = '';
    if (btn) btn.disabled = false;
  }
}
</script>
<!-- ⚙️ THEME TOGGLE (Standalone Script) -->
<script>
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('admin_theme', theme); } catch(e) {}
    var icon = document.getElementById('themeIcon');
    if (icon) {
      icon.className = (theme === 'light') ? 'fas fa-moon' : 'fas fa-sun';
    }
  }
  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }
  applyTheme((function() {
    try { return localStorage.getItem('admin_theme'); } catch(e) { return null; }
  })() || 'dark');
  console.log('✅ Theme toggle loaded successfully');
</script>
</body>
</html>
