<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global EdTech Original IELTS Test 2 Reading</title>
    <style>
        :root {
            --bg: #f7f7f8; --surface: #ffffff; --surface-muted: #f2f2f3; --border: #e4e4e7;
            --text-primary: #18181b; --text-secondary: #52525b; --text-tertiary: #a1a1aa;
            --accent: #2a7de1; --positive: #16a34a; --danger: #dc2626;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --radius: 10px; --radius-sm: 6px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }

        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .logo { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .timer { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

        .nav-tabs { display: flex; gap: 8px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .tab-btn:hover:not(.active) { background: var(--surface-muted); }

        .reading-container { flex: 1; display: flex; overflow: hidden; background: var(--surface); border-bottom: 1px solid var(--border); }
        .passage-panel { width: 50%; overflow-y: auto; padding: 30px 40px; border-right: 1px solid var(--border); line-height: 1.8; font-size: 15.5px; color: var(--text-primary); }
        .passage-panel h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .passage-panel .sub { font-style: italic; text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
        .passage-panel p { margin-bottom: 16px; }

        .questions-panel { width: 50%; overflow-y: auto; padding: 30px 40px; background: var(--bg); }
        .questions-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .q-label { font-size: 13px; color: var(--text-tertiary); margin-bottom: 12px; font-style: italic; line-height: 1.6; }
        .q-block { margin-bottom: 24px; padding: 16px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); }
        .q-text { font-size: 15px; font-weight: 500; margin-bottom: 12px; line-height: 1.6; display: flex; gap: 10px; }
        .q-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-muted); font-size: 13px; font-weight: 700; flex-shrink: 0; }
        .q-num.answered { background: var(--text-primary); color: #fff; }
        .q-num.correct { background: var(--positive); color: #fff; }
        .q-num.wrong { background: var(--danger); color: #fff; }

        .opts { display: flex; flex-direction: column; gap: 8px; margin-left: 38px; }
        .opt-label { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: 0.2s; font-size: 14px; color: var(--text-secondary); }
        .opt-label:hover { background: var(--surface-muted); }
        .opt-label input[type="radio"] { width: 16px; height: 16px; accent-color: var(--text-primary); }
        .opt-label.sel { background: var(--surface-muted); border-color: var(--border); color: var(--text-primary); }

        .txt-inp { margin-left: 38px; width: calc(100% - 38px); padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; }
        .txt-inp:focus { border-color: var(--text-primary); }
        .txt-inp.ok { border-color: var(--positive); background: #f0fdf4; }
        .txt-inp.bad { border-color: var(--danger); background: #fef2f2; }

        .fb { font-size: 12px; margin-left: 38px; margin-top: 6px; color: var(--text-tertiary); display: none; }
        .fb.vis { display: block; }

        .footer { background: var(--surface); border-top: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .left-controls { display: flex; gap: 12px; }
        .right-controls { display: flex; gap: 12px; }
        .btn { padding: 10px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
        .btn-secondary:hover { background: #f0f4fe; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: #1a5fb4; }
        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
        .dot.on { background: var(--text-primary); }

        @media (max-width: 768px) {
            .reading-container { flex-direction: column; }
            .passage-panel { width: 100%; max-height: 40%; border-right: none; border-bottom: 1px solid var(--border); }
            .questions-panel { width: 100%; max-height: 60%; }
            .nav-tabs { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">Global EdTech Original IELTS Test 2 Reading</div>
        <div class="timer">60 Minutes</div>
        <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 11px; font-weight: bold; margin-left: 15px; line-height: 1.2;"><span style="font-size: 20px; margin-bottom: 2px;">🏠</span>Home</a>
    </div>

    <div class="nav-tabs" id="navTabs">
        <button class="tab-btn active" onclick="switchTab(1)">Passage 1</button>
        <button class="tab-btn" onclick="switchTab(2)">Passage 2</button>
        <button class="tab-btn" onclick="switchTab(3)">Passage 3</button>
    </div>

    <div class="reading-container" id="reading-container"></div>

    <div class="footer">
        <div class="left-controls">
            <button class="btn btn-secondary" onclick="prevTab()" id="prevBtn" disabled>← Previous</button>
            <button class="btn btn-secondary" onclick="window.location.href='Writing_IELTS_Test2.html'" id="nextBtn">Next: Writing Section</button>
        </div>
        <div class="dots" id="dots"></div>
        <div class="right-controls">
            <button class="btn btn-secondary" onclick="resetPassage()">Reset</button>
            <button class="btn btn-secondary" onclick="showAnswers()">Show Answers</button>
            <button class="btn btn-primary" onclick="checkPassage()">Check Answers</button>
        </div>
    </div>

    <!-- Import Data -->
    <script src="new_reading_data2.js"></script>

    <!-- Main Logic -->
    <script>
        const readingData = window.newReadingQuestions2;
        let currentPassage = 1;
        const totalPassages = readingData.passages.length;

        function switchTab(n) {
            currentPassage = n;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === n - 1));
            document.getElementById('prevBtn').disabled = (n === 1);
            renderPassages();
        }

        function prevTab() { if (currentPassage > 1) switchTab(currentPassage - 1); }
        function nextTab() { if (currentPassage < totalPassages) switchTab(currentPassage + 1); else finishTest(); }

        function renderPassages() {
            const container = document.getElementById('reading-container');
            const passage = readingData.passages[currentPassage - 1];
            const qStart = passage.questions[0].id;
            const qEnd = passage.questions[passage.questions.length - 1].id;

            let passageHtml = `<div class="passage-panel"><h2>Passage ${passage.id}</h2><p class="sub">${passage.title}</p>`;
            const paragraphs = passage.passage.split('\n');
            paragraphs.forEach(p => { if (p.trim()) passageHtml += `<p>${p.trim()}</p>`; });
            passageHtml += `</div>`;

             // Build Right Panel (Questions)
            let questionHtml = `<div class="questions-panel">
                <h3>Questions ${qStart} – ${qEnd}</h3>
                <div class="q-section">`;

            passage.questions.forEach(q => {        // --- INSTRUCTION INJECTION HACK ---
        if (q.id == 1) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 1–5</p>
                <p style="margin-bottom: 10px;">Do the following statements agree with the information given in Reading Passage 1?</p>
                <p style="margin-bottom: 10px;">In boxes 1–5 on your answer sheet, write</p>
                <ul style="margin-bottom: 0; padding-left: 20px;">
                    <li><strong>TRUE</strong> if the statement agrees with the information</li>
                    <li><strong>FALSE</strong> if the statement contradicts the information</li>
                    <li><strong>NOT GIVEN</strong> if there is no information on this</li>
                </ul>
            </div>`;
                } else if (q.id == 6) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 6–9</p>
                <p style="margin-bottom: 10px;">Look at the following statements (Questions 6–9) and the list of options below.</p>
                <p style="margin-bottom: 10px;">Match each statement with the correct option, <strong>A–F</strong>.</p>
                <p style="margin-bottom: 10px;">Write the correct letter, <strong>A–F</strong>, in boxes 6–9 on your answer sheet.</p>
                <p style="margin-bottom: 15px; font-weight: bold;"><strong>NB</strong> You may use any letter more than once.</p>
                
                <div style="border: 1px solid #ccc; padding: 10px; background-color: #ffffff; border-radius: 4px;">
                    <p style="font-weight: bold; text-align: center; margin-bottom: 10px; color: #1F3864;">List of Options</p>
                    <ul style="list-style-type: none; padding-left: 0; margin-bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <li><strong>A.</strong> Air quality</li>
                        <li><strong>B.</strong> Temperature regulation</li>
                        <li><strong>C.</strong> Social well being</li>
                        <li><strong>D.</strong> Economic impact</li>
                        <li><strong>E.</strong> Challenges</li>
                        <li><strong>F.</strong> Solutions</li>
                    </ul>
                </div>
            </div>`;
                } else if (q.id == 10) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 10–11</p>
                <p style="margin-bottom: 10px;">Complete the sentences below.</p>
                <p style="margin-bottom: 10px;">Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.</p>
                <p style="margin-bottom: 0;">Write your answers in boxes 10–11 on your answer sheet.</p>
            </div>`;
               } else if (q.id == 12) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 12–13</p>
                <p style="margin-bottom: 10px;">Choose the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.</p>
                <p style="margin-bottom: 0;">Write the correct letter in boxes 12–13 on your answer sheet.</p>
            </div>`;
        // ==========================================
        // --- TEST 2: PASSAGE 2 INSTRUCTIONS (Q14 - Q26) ---
        // ==========================================
        } else if (q.id == 14) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 14–19</p>
                <p style="margin-bottom: 10px;">Reading Passage 2 has six paragraphs, <strong>A–F</strong>.</p>
                <p style="margin-bottom: 10px;">Choose the correct heading for each paragraph from the list of headings below.</p>
                <p style="margin-bottom: 15px;">Write the correct number, <strong>i–x</strong>, in boxes 14–19 on your answer sheet.</p>
                <div style="border: 1px solid #ccc; padding: 15px; background-color: #ffffff; border-radius: 4px;">
                    <p style="font-weight: bold; text-align: center; margin-bottom: 15px; color: #1F3864; border-bottom: 2px solid #1F3864; padding-bottom: 5px;">List of Headings</p>
                    <ul style="list-style-type: none; padding-left: 0; margin-bottom: 0; display: grid; grid-template-columns: 1fr; gap: 8px; font-size: 0.95em;">
                        <li><strong>i.</strong> Urban planning and architecture</li>
                        <li><strong>ii.</strong> Trade and economic systems</li>
                        <li><strong>iii.</strong> The undeciphered script</li>
                        <li><strong>iv.</strong> Causes of decline</li>
                        <li><strong>v.</strong> Modern archaeological discoveries</li>
                        <li><strong>vi.</strong> Early development of the civilization</li>
                        <li><strong>vii.</strong> Social structure and governance</li>
                        <li><strong>viii.</strong> Cultural influence on later societies</li>
                        <li><strong>ix.</strong> International trade connections</li>
                        <li><strong>x.</strong> Mystery of the inscriptions</li>
                    </ul>
                </div>
            </div>`;
        } else if (q.id == 20) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 20–22</p>
                <p style="margin-bottom: 10px;">Do the following statements agree with the views of the writer in Reading Passage 2?</p>
                <p style="margin-bottom: 10px;">In boxes 20–22 on your answer sheet, write</p>
                <ul style="margin-bottom: 0; padding-left: 20px;">
                    <li><strong>YES</strong> if the statement agrees with the views of the writer</li>
                    <li><strong>NO</strong> if the statement contradicts the views of the writer</li>
                    <li><strong>NOT GIVEN</strong> if it is impossible to say what the writer thinks about this</li>
                </ul>
            </div>`;
        } else if (q.id == 23) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 23–25</p>
                <p style="margin-bottom: 10px;">Complete the summary below.</p>
                <p style="margin-bottom: 0;">Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.</p>
            </div>`;
        } else if (q.id == 26) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Question 26</p>
                <p style="margin-bottom: 10px;">Choose the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.</p>
                <p style="margin-bottom: 0;">Write the correct letter in box 26 on your answer sheet.</p>
            </div>`;
        
        // ==========================================
        // --- TEST 2: PASSAGE 3 INSTRUCTIONS (Q27 - Q40) ---
        // ==========================================
        } else if (q.id == 27) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 27–30</p>
                <p style="margin-bottom: 10px;">Choose the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.</p>
                <p style="margin-bottom: 0;">Write the correct letter in boxes 27–30 on your answer sheet.</p>
            </div>`;
        } else if (q.id == 31) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 31–34</p>
                <p style="margin-bottom: 10px;">Do the following statements agree with the claims of the writer in Reading Passage 3?</p>
                <p style="margin-bottom: 10px;">In boxes 31–34 on your answer sheet, write</p>
                <ul style="margin-bottom: 0; padding-left: 20px;">
                    <li><strong>YES</strong> if the statement agrees with the claims of the writer</li>
                    <li><strong>NO</strong> if the statement contradicts the claims of the writer</li>
                    <li><strong>NOT GIVEN</strong> if it is impossible to say what the writer thinks about this</li>
                </ul>
            </div>`;
        } else if (q.id == 35) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 35–37</p>
                <p style="margin-bottom: 10px;">Look at the following statements (Questions 35–37) and the list of options below.</p>
                <p style="margin-bottom: 10px;">Match each statement with the correct option, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>.</p>
                <p style="margin-bottom: 15px;">Write the correct letter, <strong>A</strong>, <strong>B</strong> or <strong>C</strong>, in boxes 35–37 on your answer sheet.</p>
                <p style="margin-bottom: 15px; font-weight: bold;"><strong>NB</strong> You may use any letter more than once.</p>
                <div style="border: 1px solid #ccc; padding: 15px; background-color: #ffffff; border-radius: 4px;">
                    <p style="font-weight: bold; text-align: center; margin-bottom: 10px; color: #1F3864;">Biases</p>
                    <ul style="list-style-type: none; padding-left: 0; margin-bottom: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; font-weight: bold; color: #1F3864;">
                        <li>A. Confirmation bias</li>
                        <li>B. Availability heuristic</li>
                        <li>C. Anchoring bias</li>
                    </ul>
                </div>
            </div>`;
        } else if (q.id == 38) {
            questionHtml += `
            <div style="background-color: #f4f6f8; border-left: 5px solid #1F3864; padding: 15px; margin-bottom: 25px; border-radius: 4px;">
                <p style="font-weight: bold; margin-bottom: 10px; color: #1F3864;">Questions 38–40</p>
                <p style="margin-bottom: 10px;">Complete the flowchart below.</p>
                <p style="margin-bottom: 0;">Choose <strong>NO MORE THAN TWO WORDS</strong> from the passage for each answer.</p>
            </div>`;
        }
        // --- END OF INSTRUCTION INJECTION ---
                if (q.type === 'tfng') {
                    questionHtml += `<div class="q-block" data-q="${q.id}" data-type="tfng">
                        <div class="q-text"><span class="q-num" id="n${q.id}">${q.id}</span>${q.q}</div>
                        <div class="opts">
                            <label class="opt-label"><input type="radio" name="q${q.id}" value="True"><span>True</span></label>
                            <label class="opt-label"><input type="radio" name="q${q.id}" value="False"><span>False</span></label>
                            <label class="opt-label"><input type="radio" name="q${q.id}" value="Not Given"><span>Not Given</span></label>
                        </div><div class="fb" id="fb${q.id}"></div></div>`;
                } else if (q.type === 'mc') {
                    questionHtml += `<div class="q-block" data-q="${q.id}" data-type="mc">
                        <div class="q-text"><span class="q-num" id="n${q.id}">${q.id}</span>${q.q}</div><div class="opts">`;
                    q.options.forEach((opt, i) => {
                        const letter = String.fromCharCode(65 + i);
                        questionHtml += `<label class="opt-label"><input type="radio" name="q${q.id}" value="${letter}"><span>${letter} — ${opt}</span></label>`;
                    });
                    questionHtml += `</div><div class="fb" id="fb${q.id}"></div></div>`;
                } else if (q.type === 'match') {
                    questionHtml += `<div class="q-block" data-q="${q.id}" data-type="match">
                        <div class="q-text"><span class="q-num" id="n${q.id}">${q.id}</span>${q.q}</div>
                        <input type="text" class="txt-inp" id="inp${q.id}"><div class="fb" id="fb${q.id}"></div></div>`;
                } else if (q.type === 'fill') {
                    questionHtml += `<div class="q-block" data-q="${q.id}" data-type="fill">
                        <div class="q-text"><span class="q-num" id="n${q.id}">${q.id}</span>${q.q.replace('______', '')}</div>
                        <input type="text" class="txt-inp" id="inp${q.id}"><div class="fb" id="fb${q.id}"></div></div>`;
                }
            });

            questionHtml += `</div></div>`;
            container.innerHTML = passageHtml + questionHtml;
            updateDots();
        }

        function updateDots() {
            const dots = document.getElementById('dots');
            dots.innerHTML = '';
            const passage = readingData.passages[currentPassage - 1];
            passage.questions.forEach(q => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (q.type === 'tfng' || q.type === 'mc') {
                    if (document.querySelector(`input[name="q${q.id}"]:checked`)) dot.classList.add('on');
                } else {
                    if (document.getElementById(`inp${q.id}`) && document.getElementById(`inp${q.id}`).value.trim() !== '') dot.classList.add('on');
                }
                dots.appendChild(dot);
            });
        }

        function resetPassage() {
            readingData.passages.forEach(passage => {
                passage.questions.forEach(q => {
                    if (q.type === 'tfng' || q.type === 'mc') {
                        document.querySelectorAll(`input[name="q${q.id}"]`).forEach(radio => {
                            radio.checked = false;
                            radio.closest('.opt-label').classList.remove('sel');
                        });
                    } else {
                        const inp = document.getElementById(`inp${q.id}`);
                        if (inp) { inp.value = ''; inp.classList.remove('ok', 'bad'); }
                    }
                    const fb = document.getElementById(`fb${q.id}`);
                    if (fb) { fb.classList.remove('vis'); fb.textContent = ''; }
                    const num = document.getElementById(`n${q.id}`);
                    if (num) num.classList.remove('correct', 'wrong', 'answered');
                });
            });
            currentPassage = 1;
            switchTab(1);
        }

        function checkPassage() {
            const passage = readingData.passages[currentPassage - 1];
            let correctCount = 0;
            let totalCount = 0;
            passage.questions.forEach(q => {
                totalCount++;
                let user = '';
                if (q.type === 'tfng' || q.type === 'mc') {
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    user = sel ? sel.value : '';
                    if (user) sel.closest('.opt-label').classList.add('sel');
                } else {
                    const inp = document.getElementById(`inp${q.id}`);
                    user = inp ? inp.value.trim().toLowerCase() : '';
                }
                const fb = document.getElementById(`fb${q.id}`);
                const num = document.getElementById(`n${q.id}`);
                let isCorrect = false;
                if (q.type === 'mc' || q.type === 'tfng' || q.type === 'ynng') {
                    isCorrect = user === q.answer;
                } else {
                    isCorrect = user === q.answer.toLowerCase();
                }
                if (isCorrect) {
                    correctCount++;
                    if (num) num.classList.add('correct');
                    if (fb) { fb.textContent = 'Correct!'; fb.style.color = 'var(--positive)'; fb.classList.add('vis'); }
                } else {
                    if (num) num.classList.add('wrong');
                    if (fb) { fb.textContent = 'Correct answer: ' + q.answer; fb.style.color = 'var(--danger)'; fb.classList.add('vis'); }
                }
            });
            alert(`Passage ${currentPassage} Score: ${correctCount} / ${totalCount}`);
        }

        function showAnswers() {
            const passage = readingData.passages[currentPassage - 1];
            passage.questions.forEach(q => {
                if (q.type === 'tfng' || q.type === 'mc' || q.type === 'ynng') {
                    const correctRadio = document.querySelector(`input[name="q${q.id}"][value="${q.answer}"]`);
                    if (correctRadio) { correctRadio.checked = true; correctRadio.closest('.opt-label').classList.add('sel'); }
                } else {
                    const inp = document.getElementById(`inp${q.id}`);
                    if (inp) { inp.value = q.answer; inp.classList.add('ok'); }
                }
                const num = document.getElementById(`n${q.id}`);
                if (num) num.classList.add('correct');
            });
            alert("Correct answers have been filled in for this passage.");
        }

                function finishTest() {
            window.location.href = 'Writing_IELTS_Test2.html';
        }

        window.onload = function() { switchTab(1); };
    </script>
