<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global EdTech Original IELTS Test 1 Writing</title>
    <style>
        :root {
            --bg: #f7f7f8; --surface: #ffffff; --surface-muted: #f2f2f3; --border: #e4e4e7;
            --text-primary: #18181b; --text-secondary: #52525b; --text-tertiary: #a1a1aa;
            --accent: #2a7de1; --positive: #16a34a; --danger: #dc2626;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --radius: 10px; --radius-sm: 6px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }

        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .logo { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .timer { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

        .writing-container { flex: 1; overflow-y: auto; padding: 30px 40px; }

        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
        .task-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .task-instruction { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
        
        .chart-container { text-align: center; margin-bottom: 16px; }
        .chart-container img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border); }

        .textarea-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .writing-area { width: 100%; min-height: 250px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; line-height: 1.6; font-family: var(--font-sans); resize: vertical; outline: none; }
        .writing-area:focus { border-color: var(--accent); }

        .btn { padding: 10px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
        .btn-secondary:hover { background: #f0f4fe; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: #1a5fb4; }

        .model-answer-section { margin-top: 24px; display: none; }
        .model-answer-box { background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-size: 14px; line-height: 1.6; color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">Global EdTech Original IELTS Test 1 Writing</div>
        <div class="timer">60 Minutes</div>
        <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 11px; font-weight: bold; margin-left: 15px; line-height: 1.2;"><span style="font-size: 20px; margin-bottom: 2px;">🏠</span>Home</a>
    </div>

    <div class="writing-container">
        
        <!-- Task 1 -->
        <div class="task-card">
            <div class="task-title" id="task1-title"></div>
            <div class="task-instruction" id="task1-instruction"></div>
            <div class="chart-container">
                <img id="task1-image" src="" alt="Chart">
            </div>
            <div class="textarea-label">Your Answer (Task 1):</div>
            <textarea class="writing-area" id="task1-answer" placeholder="Write your Task 1 report here... (at least 150 words)"></textarea>
            <div style="margin-top: 16px; display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="showModelAnswer('task1')">Show Model Answer</button>
                <button class="btn btn-secondary" onclick="clearAnswer('task1')">Clear</button>
            </div>
            <div class="model-answer-section" id="model-task1">
                <div class="textarea-label">Model Answer:</div>
                <div class="model-answer-box" id="task1-model-text"></div>
            </div>
        </div>

        <!-- Task 2 -->
        <div class="task-card">
            <div class="task-title" id="task2-title"></div>
            <div class="task-instruction" id="task2-instruction"></div>
            <div class="textarea-label">Your Answer (Task 2):</div>
            <textarea class="writing-area" id="task2-answer" placeholder="Write your Task 2 essay here... (at least 250 words)"></textarea>
            <div style="margin-top: 16px; display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="showModelAnswer('task2')">Show Model Answer</button>
                <button class="btn btn-secondary" onclick="clearAnswer('task2')">Clear</button>
            </div>
            <div class="model-answer-section" id="model-task2">
                <div class="textarea-label">Model Answer (Band 9):</div>
                <div class="model-answer-box" id="task2-model-text"></div>
                
                <div class="textarea-label" style="margin-top: 16px;">Model Answer (Band 7):</div>
                <div class="model-answer-box" id="task2-model-band7-text"></div>
            </div>
        </div>

    </div>

    <!-- Import Data -->
    <script src="new_writing_data1.js"></script>

    <!-- Main Logic -->
    <script>
        const writingData = window.newWritingQuestions1;

                function splitParagraphs(text) {
            return text.split('\n').map(line => line.trim()).filter(line => line.length > 0).map(line => '<p>' + line + '</p>').join('');
        }

        function loadTasks() {
            // Task 1
            document.getElementById('task1-title').textContent = writingData.task1.title;
            document.getElementById('task1-instruction').textContent = writingData.task1.instruction;
            document.getElementById('task1-image').src = writingData.task1.image;
            document.getElementById('task1-model-text').innerHTML = splitParagraphs(writingData.task1.modelAnswer);

            // Task 2
            document.getElementById('task2-title').textContent = writingData.task2.title;
            document.getElementById('task2-instruction').textContent = writingData.task2.instruction;
            document.getElementById('task2-model-text').innerHTML = splitParagraphs(writingData.task2.modelAnswerBand9);
            document.getElementById('task2-model-band7-text').innerHTML = splitParagraphs(writingData.task2.modelAnswerBand7);
        }
        function showModelAnswer(task) {
            const sectionId = 'model-' + task;
            const section = document.getElementById(sectionId);
            if (section) section.style.display = 'block';
        }

        function clearAnswer(task) {
            const answerId = task + '-answer';
            document.getElementById(answerId).value = '';
        }

        window.onload = function() {
            loadTasks();
        };
    </script>

</body>
</html>
